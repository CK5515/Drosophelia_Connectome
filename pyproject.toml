[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "flybrain"
version = "0.1.0"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "brian2: compares against the Brian2 reference simulator",
    "gpu: needs CUDA",
    "realdata: needs data/raw files downloaded",
]
